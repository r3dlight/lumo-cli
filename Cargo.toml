[package]
name = "lumo-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Unofficial terminal coding agent for Proton Lumo (Claude Code style)"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "7.0.0"
futures-util = "0.3.34"
landlock = "0.4.7"
owo-colors = "4.4.0"
pgp = "0.20.0"
proton-srp = "0.8.2"
rand = "0.8"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream", "http2", "cookies"] }
rpassword = "7.5.4"
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
toml = "1.1"
uuid = { version = "1.26.0", features = ["v4"] }
zeroize = "1.9.0"

# ANSSI Rust guide: no panicking construct and no unchecked arithmetic in
# production code (LANG-LIMIT-PANIC, LANG-UNWRAP-RESTRICT, LANG-ARRINDEXING,
# LANG-INTEGER-OVERFLOW, MEM-FORGET-LINT). `main.rs` relaxes these for tests.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
mem_forget = "deny"

# Keep integer overflow a detected error in release builds too (belt and
# braces over the checked arithmetic above); negligible cost for a CLI.
[profile.release]
overflow-checks = true
